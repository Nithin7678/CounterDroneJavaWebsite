<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Drone | Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif; min-height: 100vh; display: flex;
            justify-content: center; align-items: center;
            background: linear-gradient(135deg, #071426, #102d4a, #071426);
            color: #fff;
        }
        .login-container {
            width: 90%; max-width: 420px; padding: 35px;
            background: #102238; border: 1px solid #29465f;
            border-radius: 15px; box-shadow: 0 10px 35px rgba(0,0,0,.35);
        }
        .logo { text-align: center; font-size: 42px; margin-bottom: 12px; }
        h1 { text-align: center; font-size: 25px; margin-bottom: 8px; }
        .subtitle {
            text-align: center; color: #a9bfd2; font-size: 14px;
            margin-bottom: 28px; line-height: 1.5;
        }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #dce8f2; }
        input {
            width: 100%; padding: 12px; margin-bottom: 20px;
            border: 1px solid #3a5871; border-radius: 7px;
            background: #091827; color: white; font-size: 15px;
        }
        input:focus { outline: 2px solid #38bdf8; }
        button {
            width: 100%; padding: 13px; background: #1685d1; color: white;
            border: none; border-radius: 7px; font-size: 16px;
            font-weight: bold; cursor: pointer;
        }
        button:hover { background: #0874bb; }
        .error {
            background: #54252b; color: #ffb8bd; padding: 10px;
            margin-bottom: 18px; border-radius: 6px; font-size: 14px;
            text-align: center;
        }
        .footer { margin-top: 24px; text-align: center; font-size: 12px; color: #8fa8bd; }
    </style>
</head>
<body>
    <main class="login-container">
        <div class="logo">🛡️</div>
        <h1>Counter-Drone System</h1>
        <p class="subtitle">Threat Detection and Management Dashboard<br>Sign in to continue</p>

        <div class="error" th:if="${param.error}">Invalid username or password.</div>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <p class="subtitle" th:if="${param.logout}">You have been logged out.</p>

        <form th:action="@{/login}" method="post">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Sign In</button>
        </form>

        <p class="footer">Authorized access only</p>
    </main>
</body>
</html>
