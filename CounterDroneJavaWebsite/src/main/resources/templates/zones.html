<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Surveillance Zones</title><link rel="stylesheet" href="/app.css"></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Operations / coverage</div><h1>Surveillance zones</h1><p class="muted">Manage demo zones used when recording detections.</p></div><a class="btn" href="/dashboard">Dashboard</a></header><nav class="nav"><a href="/detections">Detections</a><a href="/alerts">Alerts</a><a href="/zones">Zones</a><a href="/reports">Reports</a></nav><div class="success" th:if="${success}" th:text="${success}"></div><div class="error" th:if="${error}" th:text="${error}"></div><section class="grid"><div class="panel"><h2>Add a zone</h2><form action="/zones" method="post"><div class="field"><label for="name">Zone name *</label><input id="name" name="name" placeholder="e.g. Main Campus Gate" required maxlength="80"></div><div class="field" style="margin-top:14px"><label for="securityLevel">Security level</label><select id="securityLevel" name="securityLevel"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div><div style="margin-top:16px"><button class="btn primary" type="submit">Add zone</button></div></form></div><div class="panel"><h2>Configured zones</h2><div class="tablewrap"><table><thead><tr><th>ZONE</th><th>LEVEL</th><th>STATUS</th><th>ACTION</th></tr></thead><tbody><tr th:each="z : ${zones}"><td th:text="${z.name}"></td><td th:text="${z.securityLevel}"></td><td th:text="${z.active ? 'Active' : 'Inactive'}"></td><td><form th:action="@{/zones/{id}/toggle(id=${z.id})}" method="post"><button class="btn" type="submit" th:text="${z.active ? 'Deactivate' : 'Activate'}"></button></form></td></tr></tbody></table></div></div></section></main></body></html>
